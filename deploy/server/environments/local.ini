# Scene-master application settings for the local Docker stack.
# Docker supplies the server role, network endpoints, and credentials separately.
[Settings]

# legacy = old cities/old ships/old designer
# modern = new cities/new ships/new designer
gameGeneration=legacy

# all = every galaxy; 1galaxy = only Shores of Hazeron.
# Existing galaxies in the database are retained.
galaxyGen=1galaxy

# Mail periodic city reports to the city's chain of command: false or true.
mailReports=true
